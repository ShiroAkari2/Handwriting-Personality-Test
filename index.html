<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handwriting Personality test - ShiroAkari Project</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --text: #2b2622; --muted: #7a7068;
    --line: #e6ded3; --accent: #c4572b; --accent-soft: #f6e3da; --accent-2: #3b6e8f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --card: #26221f; --text: #f1ebe4; --muted: #a39a90;
      --line: #3a342f; --accent: #e8794c; --accent-soft: #3b2a22; --accent-2: #6fb0d6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  main {
    width: 100%; max-width: 600px; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; padding: 24px;
  }
  header { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 14px; }
  header .title { font-size: 1.35rem; font-weight: 700; margin: 0; }
  header .by { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
  h1 { font-size: 1.5rem; margin: 4px 0 6px; }
  h2 { font-size: 1.2rem; margin: 16px 0; line-height: 1.35; }
  p { line-height: 1.6; margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }
  .options { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .opt {
    width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 14px; font: inherit; cursor: pointer;
  }
  .opt:hover, .opt:focus-visible { border-color: var(--accent); outline: none; background: var(--accent-soft); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .glyph { flex: 0 0 52px; display: flex; justify-content: center; }
  .glyph svg { width: 44px; height: 58px; fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .btn {
    font: inherit; padding: 10px 16px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }
  .tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 2px 10px; font-size: .8rem; margin-bottom: 4px; }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .2em; color: var(--accent); font-weight: 700; font-size: 1.1rem; }
  .tagline { color: var(--muted); font-style: italic; margin-bottom: 12px; }
  .axis { margin: 14px 0; }
  .axis .label { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 4px; }
  .axis .label .win { font-weight: 700; color: var(--accent); }
  .axis .track { height: 10px; background: var(--accent-2); border-radius: 99px; overflow: hidden; opacity: .9; }
  .axis .fill { height: 100%; background: var(--accent); }
  .note { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: .9rem; margin: 12px 0; }
</style>
</head>

// ============ Logika ============
const app = document.getElementById("app");
const NS = "http://www.w3.org/2000/svg";
let step = 0;
let answers = new Array(Q.length).fill(null);

function el(tag, props, children) {
  const n = document.createElement(tag);
  Object.assign(n, props || {});
  (children || []).forEach(c => n.append(c));
  return n;
}

function glyph(d) {
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 60 80");
  svg.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", d);
  svg.append(p);
  return el("span", { className: "glyph" }, [svg]);
}

function header() {
  return el("header", {}, [
    el("p", { className: "title", textContent: "Handwriting Personality test" }),
    el("p", { className: "by", textContent: "By ShiroAkari Project" })
  ]);
}

function renderQuestion() {
  const item = Q[step];
  app.replaceChildren(
    header(),
    el("div", { className: "muted", textContent: "Pertanyaan " + (step + 1) + " dari " + Q.length }),
    el("div", { className: "progress" }, [
      Object.assign(el("div"), { style: "width:" + (step / Q.length * 100) + "%" })
    ]),
    el("h2", { textContent: item.q }),
    el("ul", { className: "options" }, item.o.map((opt, idx) => {
      const btn = el("button", {
        className: "opt" + (answers[step] === idx ? " sel" : ""),
        type: "button"
      }, [glyph(opt[2]), el("span", { textContent: opt[0] })]);
      btn.addEventListener("click", () => { answers[step] = idx; step++; render(); });
      return el("li", {}, [btn]);
    })),
    (() => {
      const back = el("button", { className: "btn", type: "button", textContent: "Kembali", disabled: step === 0 });
      back.addEventListener("click", () => { step--; render(); });
      return el("div", { className: "row" }, [back]);
    })()
  );
}

function computeScores() {
  const s = {};
  AXES.forEach(ax => { s[ax.a] = 0; s[ax.b] = 0; });
  answers.forEach((a, i) => {
    if (a === null) return;
    Q[i].o[a][1].split("").forEach(ch => { s[ch]++; });
  });
  return s;
}

function renderResult() {
  const s = computeScores();
  let code = "";
  const axisViews = AXES.map(ax => {
    const total = (s[ax.a] + s[ax.b]) || 1;
    const pctA = Math.round(s[ax.a] / total * 100);
    const winA = s[ax.a] >= s[ax.b];
    code += winA ? ax.a : ax.b;
    return { ax, pctA, winA };
  });

  const type = TYPES[code];
  const desc = code.split("").map(ch => BLURB[ch]).join(" ");
  const perfPct = axisViews[1].pctA;

  const bars = axisViews.map(v => el("div", { className: "axis" }, [
    el("div", { className: "label" }, [
      el("span", { className: v.winA ? "win" : "", textContent: v.ax.an + " " + v.pctA + "%" }),
      el("span", { className: v.winA ? "" : "win", textContent: v.ax.bn + " " + (100 - v.pctA) + "%" })
    ]),
    el("div", { className: "track" }, [
      Object.assign(el("div", { className: "fill" }), { style: "width:" + v.pctA + "%" })
    ])
  ]));

  const again = el("button", { className: "btn primary", type: "button", textContent: "Ulangi tes" });
  again.addEventListener("click", () => { step = 0; answers = new Array(Q.length).fill(null); render(); });

  const copy = el("button", { className: "btn", type: "button", textContent: "Salin hasil" });
  copy.addEventListener("click", async () => {
    const text = "Hasil Handwriting Personality test (ShiroAkari Project): " + code + " - " + type[0];
    try { await navigator.clipboard.writeText(text); copy.textContent = "Tersalin!"; }
    catch (e) { copy.textContent = "Gagal menyalin"; }
  });

  const children = [
    header(),
    el("span", { className: "tag", textContent: "Hasil kepribadianmu" }),
    el("div", { className: "code", textContent: code }),
    el("h1", { textContent: type[0] }),
    el("p", { className: "tagline", textContent: type[1] }),
    el("p", { textContent: desc }),
    ...bars
  ];
  if (perfPct >= 70) {
    children.push(el("div", { className: "note", textContent: "kecenderungan perfeksionisme("  + perfPct +  "%)." }));
  }
  children.push(
    el("p", { className: "muted", textContent: "MAKASIH SUDAH MENCOBANYA TEMAN-TEMAN" }),
    el("div", { className: "row" }, [again, copy])
  );
  app.replaceChildren(...children);
}

function render() {
  if (step >= Q.length) renderResult(); else renderQuestion();
}

render();
</script>
</body>
</html>
